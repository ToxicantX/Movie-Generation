<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%230f766e'/%3E%3Cpath d='M8 9h16v14H8z' fill='none' stroke='white' stroke-width='2'/%3E%3Cpath d='m14 12 7 4-7 4z' fill='white'/%3E%3C/svg%3E">
  <title>项目流程图中心</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #eef1f4;
      --panel: #ffffff;
      --ink: #17212b;
      --muted: #66727e;
      --line: #d5dce2;
      --accent: #0f766e;
      --accent-soft: #dff3f0;
      --warm: #b45309;
      --shadow: 0 14px 36px rgba(28, 40, 52, 0.11);
    }

    * { box-sizing: border-box; }

    html, body {
      min-height: 100%;
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font-family: Inter, "Microsoft YaHei", "PingFang SC", sans-serif;
      letter-spacing: 0;
    }

    body {
      display: grid;
      grid-template-rows: auto 1fr;
    }

    header {
      min-height: 68px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      padding: 0 30px;
      background: #17212b;
      color: #ffffff;
      border-bottom: 1px solid #2e3c48;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 11px;
      min-width: 0;
    }

    .brand-mark {
      width: 32px;
      height: 32px;
      flex: 0 0 auto;
      display: grid;
      place-items: center;
      border-radius: 6px;
      background: var(--accent);
      font-size: 12px;
      font-weight: 800;
    }

    .brand strong {
      display: block;
      font-size: 16px;
      line-height: 1.35;
    }

    .brand span {
      display: block;
      margin-top: 2px;
      color: #aeb9c3;
      font-size: 11px;
    }

    .project-count {
      color: #bdc7cf;
      font-size: 12px;
      white-space: nowrap;
    }

    main {
      width: min(1180px, calc(100% - 48px));
      margin: 0 auto;
      padding: 36px 0 48px;
    }

    .section-heading {
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 20px;
      margin-bottom: 18px;
    }

    h1 {
      margin: 0;
      font-size: 22px;
      line-height: 1.3;
      font-weight: 700;
    }

    .section-heading p {
      margin: 5px 0 0;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.5;
    }

    .project-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(min(100%, 420px), 1fr));
      gap: 18px;
    }

    .project-card {
      overflow: hidden;
      display: grid;
      grid-template-columns: minmax(220px, 42%) minmax(0, 1fr);
      min-height: 248px;
      border: 1px solid var(--line);
      border-radius: 7px;
      background: var(--panel);
      box-shadow: var(--shadow);
    }

    .project-preview {
      min-height: 248px;
      background: #07101e;
    }

    .project-preview img {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: cover;
      object-position: center;
    }

    .project-body {
      min-width: 0;
      padding: 24px;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
    }

    .status {
      display: inline-flex;
      align-items: center;
      min-height: 26px;
      padding: 0 9px;
      border-radius: 4px;
      background: var(--accent-soft);
      color: var(--accent);
      font-size: 11px;
      font-weight: 700;
    }

    h2 {
      margin: 17px 0 8px;
      font-size: 19px;
      line-height: 1.35;
    }

    .project-body p {
      margin: 0;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.65;
    }

    .facts {
      width: 100%;
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 8px;
      margin: 20px 0;
    }

    .fact {
      min-width: 0;
      padding-right: 8px;
      border-right: 1px solid var(--line);
    }

    .fact:last-child { border-right: 0; }

    .fact strong {
      display: block;
      font-size: 15px;
      line-height: 1.3;
    }

    .fact span {
      display: block;
      margin-top: 3px;
      color: var(--muted);
      font-size: 10px;
      line-height: 1.35;
    }

    .open-project {
      min-height: 38px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      margin-top: auto;
      padding: 0 15px;
      border: 1px solid var(--accent);
      border-radius: 5px;
      background: var(--accent);
      color: #ffffff;
      font-size: 13px;
      font-weight: 650;
      text-decoration: none;
    }

    .open-project:hover { background: #0b655e; }

    @media (max-width: 700px) {
      header { padding: 0 18px; }
      main { width: min(100% - 28px, 1180px); padding-top: 24px; }
      .project-card { grid-template-columns: 1fr; }
      .project-preview { min-height: 190px; max-height: 220px; }
      .project-body { padding: 20px; }
      .section-heading { align-items: start; flex-direction: column; }
    }
  </style>
</head>
<body>
  <header>
    <div class="brand">
      <div class="brand-mark">PX</div>
      <div>
        <strong>项目流程图中心</strong>
        <span>Project Flow Explorer</span>
      </div>
    </div>
    <div class="project-count">1 个可用项目</div>
  </header>
  <main>
    <div class="section-heading">
      <div>
        <h1>选择项目</h1>
        <p>进入项目后查看总览、阶段流程、数据边界和重跑链路。</p>
      </div>
    </div>
    <section class="project-grid" aria-label="项目列表">
      <article class="project-card">
        <div class="project-preview">
          <img src="00-full-pipeline-overview.visual-check.1440x900.dark.png" alt="电影生成流水线总览预览">
        </div>
        <div class="project-body">
          <span class="status">流程图已验证</span>
          <h2>Movie-Generation</h2>
          <p>从小说或剧本规划，到资产、图片和 10 秒视频片段生成的完整电影流水线。</p>
          <div class="facts" aria-label="项目流程图信息">
            <div class="fact"><strong>10</strong><span>流程图</span></div>
            <div class="fact"><strong>9/9</strong><span>Showcase</span></div>
            <div class="fact"><strong>4</strong><span>桌面尺寸验证</span></div>
          </div>
          <a class="open-project" href="movie-generation/">打开项目流程</a>
        </div>
      </article>
    </section>
  </main>
</body>
</html>
