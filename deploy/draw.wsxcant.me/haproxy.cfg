global
  log /dev/log local0
  log /dev/log local1 notice
  user haproxy
  group haproxy
  daemon

defaults
  log global
  mode tcp
  option tcplog
  timeout connect 10s
  timeout client 1h
  timeout server 1h

frontend wsxcant_proxy_mux
  bind 0.0.0.0:443
  tcp-request inspect-delay 3s
  acl is_tls req.ssl_hello_type 1
  acl is_draw_tls req.ssl_sni -i draw.wsxcant.me
  acl is_socks req.payload(0,1) -m bin 05
  acl is_http req.payload(0,1) -m bin 43 47 50 44 4f 54 48
  tcp-request content accept if is_tls
  tcp-request content accept if is_socks
  tcp-request content accept if is_http
  use_backend draw_web_tls if is_tls is_draw_tls
  use_backend https_proxy if is_tls
  use_backend socks_proxy if is_socks
  default_backend http_proxy

backend draw_web_tls
  server draw_web 127.0.0.1:8443 check

backend https_proxy
  server local_https 127.0.0.1:3129

backend socks_proxy
  server local_socks 127.0.0.1:1080

backend http_proxy
  server local_http 127.0.0.1:3128
