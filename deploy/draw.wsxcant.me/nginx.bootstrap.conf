server {
    listen 80;
    listen [::]:80;
    server_name draw.wsxcant.me;

    location /.well-known/acme-challenge/ {
        root /var/www/draw.wsxcant.me/acme;
    }

    location / {
        root /var/www/draw.wsxcant.me/current;
        index index.html;
        try_files $uri $uri/ =404;
    }
}
