server {
    listen 80;
    listen [::]:80;
    server_name draw.wsxcant.me;

    location /.well-known/acme-challenge/ {
        root /var/www/draw.wsxcant.me/acme;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 127.0.0.1:8443 ssl;
    server_name draw.wsxcant.me;

    root /var/www/draw.wsxcant.me/current;
    index index.html;

    ssl_certificate /etc/letsencrypt/live/draw.wsxcant.me/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/draw.wsxcant.me/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location / {
        try_files $uri $uri/ =404;
    }

    location ~* \.(png|jpg|jpeg|webp|svg)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
    }
}
